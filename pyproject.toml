[project]
name = "gasless-relayer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "web3>=6.15",
    "eth-account>=0.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # required by fastapi.testclient
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relayer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "scripts"]
